name: Fresh dependencies

# Downstream crates resolve the newest semver-compatible dependencies rather than
# this repository's Cargo.lock, so check that those still open the known-answer vectors.
# A failed scheduled run notifies whoever last edited the cron line or last re-enabled it.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fresh-deps.yml
      - Cargo.toml

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Tests on newest dependencies (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
          - name: portable 32-bit backends
            runner: ubuntu-latest
            rustflags: >-
              --cfg chacha20_backend="soft" --cfg poly1305_backend="soft"
              --cfg sha2_backend="soft" --cfg curve25519_dalek_bits="32"

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (https://github.com/actions/checkout/releases/tag/v6.0.2)
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch HEAD as of 2026-05-20 (https://github.com/dtolnay/rust-toolchain/tree/stable)
        with:
          toolchain: stable

      # Downstream crates with a newer rust-version than ours get versions our MSRV would skip.
      - name: Update to the newest compatible dependencies
        run: cargo update --verbose --ignore-rust-version

      # rustc ignores unknown --cfg names, so fail if a version whose names these are changes.
      - name: Check the backend cfg names still apply
        if: matrix.rustflags
        run: >-
          cargo tree -e normal --depth 0
          -i chacha20@0.10 -i poly1305@0.9 -i sha2@0.11 -i curve25519-dalek@5

      - name: Run tests
        run: cargo test
