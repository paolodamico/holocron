[package]
name = "holocron"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Reference implementation of an anonymous sealed box with a post-quantum hybrid KEM (ML-KEM + X25519)"
exclude = ["header-full.jpg"]

[dependencies]
base64 = "0.22"
getrandom = { version = "0.4", features = ["sys_rng"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "mlkem", "x25519"] }
thiserror = "2"
x-wing = { version = "0.1", features = ["zeroize"] }
zeroize = "1"
# hpke forwards no zeroize features to its ChaCha20-Poly1305 and HKDF-SHA256 dependencies. These
# enable them by feature unification, so the AEAD key, keystream buffer, Poly1305 MAC key and
# HMAC-SHA256 key state are wiped on drop.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
cipher = { version = "0.5", features = ["zeroize"] }
poly1305 = { version = "0.9", features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[features]
wasm_js = ["getrandom/wasm_js"]

[lints.rust]
missing_docs = "deny"
dead_code = "deny"
unsafe_code = "forbid"


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
