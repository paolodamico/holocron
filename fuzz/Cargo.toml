[package]
name = "holocron-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
rand_chacha = "0.10"

[dependencies.holocron]
path = ".."

[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"

[[bin]]
name = "unseal"
path = "fuzz_targets/unseal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "public_key"
path = "fuzz_targets/public_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
